name: New forensics rule
description: A failure pattern the forensics verdicts should recognise
labels: [forensics, good first issue]
body:
  - type: textarea
    id: message
    attributes:
      label: Example error message
      description: The real Playwright error text (remove private data).
    validations: { required: true }
  - type: textarea
    id: verdict
    attributes:
      label: What the verdict should be and why
      description: Environment, test code, selector, flaky or app bug, and the evidence that tells them apart.
    validations: { required: true }
